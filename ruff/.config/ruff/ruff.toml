# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[lint]
select = [
    "F",      # Pyflakes – correctness
    "E", "W", # pycodestyle – errors & warnings
    "I",      # isort
    "UP",     # pyupgrade
    "PYI",    # type hint style correctness
    "PL",     # pylint rules (subset)
    "D",      # pydocstyle
    "N",      # pep8-naming
    "B",      # flake8-bugbear – good stuff
    "ANN",    # type annotation rules
]

ignore = [
    "D203", # one-blank-line-before-class (Google conflicts)
    "D213", # multi-line summaries start on second line (Google conflicts)
    "ANN101", # missing type annotation for self (unnecessary with methods)
    "ANN102", # missing type annotation for cls
    "PLR2004", # magic value comparison nagging
    "PLR0913", # too many arguments – pylint is way too prescriptive
    "PLR0917", # too many positional arguments – same
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[lint.pydocstyle]
convention = "google"

