
# =============================================================================
# GENERAL
# =============================================================================

# Use Ctrl+a as the prefix (Ctrl+a twice sends Ctrl+a to the application).
set-option -g prefix 'C-a'
unbind-key -T root 'C-b'
bind-key -T prefix 'C-a' send-prefix

# Use Vim-style keys in copy mode and command prompts.
set-window-option -g mode-keys vi
set-option -g status-keys vi

# Enable mouse interaction and application focus notifications.
set-option -g mouse on
set-option -g focus-events on

# Scrollback history per pane.
set-option -g history-limit 20000

# Refresh the status bar every 10 seconds.
set-option -g status-interval 10

# Display informational messages for 3 seconds.
set-option -g display-time 3000

# Display pane numbers for 1.5 seconds.
set-option -g display-panes-time 1500


# =============================================================================
# SESSION MANAGEMENT
# =============================================================================

# Kill the current session (with confirmation).
bind-key -T prefix '\' confirm-before \
  -p 'kill-session #S? (y/n)' kill-session

# Reload configuration.
bind-key -T prefix 'r' source-file ~/.config/tmux/tmux.conf \; \
  display-message 'tmux configuration reloaded'


# =============================================================================
# CLIPBOARD / COPY MODE
# =============================================================================

# Copy selections to the macOS clipboard.
set-option -s copy-command 'pbcopy'

# Vim-style visual selection and copying.
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel

# Copy mouse selections to the clipboard.
bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel

# Paste the most recent tmux buffer.
bind-key -T prefix 'P' paste-buffer


# =============================================================================
# WINDOWS
# =============================================================================

# Number windows and panes starting at 1.
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows sequentially when one is closed.
set-option -g renumber-windows on

# Set the terminal/tab title to the session and window names.
set-option -g set-titles on
set-option -g set-titles-string '#S - #W'

# Display the window list.
bind-key -T prefix 'C-w' list-windows

# Rename the current window.
bind-key -T prefix 'A' command-prompt 'rename-window %%'

# Kill the current window (with confirmation).
bind-key -T prefix 'K' confirm-before \
  -p 'kill-window #I:#W? (y/n)' kill-window


# =============================================================================
# PANES
# =============================================================================

# Display pane titles along the top border.
# #T uses the pane title, which can be assigned manually.
set-option -g pane-border-status top
set-option -g pane-border-format ' [#{pane_index}] #T '

# Highlight the active pane border.
set-option -g pane-border-style 'fg=colour8'
set-option -g pane-active-border-style 'fg=green'

# Prevent applications from changing the terminal title.
set-option -g allow-set-title off

# Split panes horizontally (side by side) or vertically (stacked).
bind-key -T prefix '|' split-window -h
bind-key -T prefix 'S' split-window -v

# Navigate panes using Vim-style directional keys.
bind-key -T prefix 'h' select-pane -L
bind-key -T prefix 'j' select-pane -D
bind-key -T prefix 'k' select-pane -U
bind-key -T prefix 'l' select-pane -R

# Navigate panes without the prefix using Alt+h/j/k/l.
# These global bindings may override Alt-key input in applications.
bind-key -T root 'M-h' select-pane -L
bind-key -T root 'M-j' select-pane -D
bind-key -T root 'M-k' select-pane -U
bind-key -T root 'M-l' select-pane -R

# Resize panes using repeatable Ctrl+h/j/k/l bindings.
bind-key -T prefix -r 'C-h' resize-pane -L
bind-key -T prefix -r 'C-j' resize-pane -D
bind-key -T prefix -r 'C-k' resize-pane -U
bind-key -T prefix -r 'C-l' resize-pane -R

# Assign a custom name to the current pane.
bind-key -T prefix 'T' command-prompt -p 'Pane name:' \
  'select-pane -T "%%"'

# Toggle synchronized input across all panes in the current window.
bind-key -T prefix 'X' set-window-option synchronize-panes \; \
  display-message 'synchronize-panes is now #{?pane_synchronized,on,off}'

# Arrange all panes in a balanced grid.
bind-key -T prefix 'E' select-layout tiled


# =============================================================================
# STATUS BAR
# =============================================================================

# Use the terminal's default background.
set-option -g status-style 'fg=white,bg=default'
set-option -g status-justify centre

# Window appearance.
set-window-option -g window-status-style 'fg=white,bg=default'
set-window-option -g window-status-current-style 'fg=white,bold,bg=default'
set-window-option -g window-status-last-style 'fg=white,bg=default'
set-window-option -g window-status-separator ' '

# Highlight the active window with red parentheses.
set-window-option -g window-status-current-format \
  '#[fg=red](#[fg=white]#I*#W#F#[fg=red])'

# Left: hostname and session name.
set-option -g status-left-length 50
set-option -g status-left \
  '#[fg=green][#[fg=white] #h #[fg=blue]|#[fg=green] #S ]['

# Right: date and time.
set-option -g status-right-length 50
set-option -g status-right \
  '#[fg=green]][ #[fg=white]%a %b-%d#[fg=blue] |#[fg=white] %l:%M%p #[fg=green]]'

# Highlight windows containing activity.
set-window-option -g monitor-activity on


# =============================================================================
# POPUPS
# =============================================================================

# Menu appearance.
set-option -g menu-style 'fg=white,bg=default'
set-option -g menu-selected-style 'fg=black,bg=green'
set-option -g menu-border-style 'fg=colour8,bg=default'
set-option -g menu-border-lines single

# Inherit terminal colors (important for fzf and popup consistency).
set-option -g popup-style default
set-option -g popup-border-style default

# Direct shortcut for a general-purpose shell popup.
bind-key -T root 'M-p' display-popup \
  -w 70% -h 70% \
  -e TMUX_POPUP=1 \
  -E "${SHELL}"

# Menu to select prompts.
bind-key -T prefix 'm' display-menu \
  -T '#[fg=blue,bold] Tmux Utilities #[default]' -x C -y C \
  'Shell' s \
    'display-popup -w 70% -h 70% -e TMUX_POPUP=1 -E "${SHELL}"' \
  '' \
  'iPython' p \
    'display-popup -w 70% -h 70% -e TMUX_POPUP=1 -E "uvx ipython --theme=neutral --no-banner --no-confirm-exit --TerminalInteractiveShell.editing_mode=vi"' \
  '' \
  'Git (lazygit)' g \
    'display-popup -T " Git " -w 85% -h 80% -d #{pane_current_path} -EE "lazygit"' \
  '' \
  'Kubernetes (k9s)' u \
    'display-popup -T " Kubernetes " -w 90% -h 85% -EE "k9s"' \
  '' \
  'Kubernetes Nodes' n \
    'display-popup -T " Kubernetes Nodes " -w 80% -h 60% -EE "kubectl get nodes -o wide; printf \"\nPress Enter to close...\"; read -r answer"' \
  '' \
  'Calculator (qalc)' c \
    'display-popup -T " Calculator " -w 60% -h 40% -EE "qalc"'

