---
# Everforest Light (Hard) theme for vivid
# Adapted from https://github.com/sainnhe/everforest

colors:
  bg: "e5dfc5"
  bgdim: "e5dfc5"
  bg0: "f3ead3"
  bg1: "eae4ca"
  bg2: "e5dfc5"
  bg3: "ddd8be"
  bg4: "d8d3ba"
  bg5: "b9c0ab"

  fg: "5c6a72"

  red: "f85552"
  orange: "f57d26"
  yellow: "dfa000"
  green: "8da101"
  aqua: "35a77c"
  blue: "3a94c5"
  purple: "df69ba"
  grey0: "a6b0a0"
  grey1: "939f91"
  grey2: "829181"


core:
  normal_text:
    foreground: fg


  regular_file:
    foreground: fg


  reset_to_normal: {}

  directory:
    foreground: blue
    font-style: bold

  symlink:
    foreground: purple
    font-style: bold

  multi_hard_link:
    foreground: aqua

  fifo:
    foreground: yellow

  socket:
    foreground: aqua
    font-style: bold

  door:
    foreground: aqua
    font-style: bold

  block_device:
    foreground: blue
    background: bg2

  character_device:
    foreground: yellow
    background: bg2

  broken_symlink:
    foreground: bg0
    background: red

  missing_symlink_target:
    foreground: bg0
    background: red

  setuid:
    foreground: red
    font-style: bold

  setgid:
    foreground: yellow
    font-style: bold

  sticky_other_writable:
    foreground: bg0
    background: yellow

  file_with_capability:
    foreground: bg
    background: red

  other_writable:
    foreground: yellow

  sticky:
    foreground: bg0
    background: green

  executable_file:
    foreground: green
    font-style: bold


text:
  special:
    foreground: yellow
    font-style: bold

  todo:
    foreground: red

  licenses:
    foreground: grey1
    font-style: italic

  configuration:
    foreground: aqua

  other:
    foreground: fg


markup:
  foreground: yellow


programming:
  source:
    foreground: green

  tooling:
    foreground: aqua
    font-style: italic

    continuous-integration:
      foreground: green


media:
  foreground: purple


office:
  foreground: red


archives:
  foreground: orange
  font-style: underline

  images:
    foreground: orange
    font-style: bold


executable:
  foreground: green
  font-style: bold


unimportant:
  foreground: grey1
  font-style: italic

# vim: ft=yaml ts=2 sts=2 sw=2 sr et
